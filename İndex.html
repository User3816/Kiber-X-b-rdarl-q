<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>KRİTİK SİSTEM XƏBƏRDARLIĞI</title>
    <style>
        body { background-color: #050505; color: #ff1a1a; font-family: monospace; text-align: center; padding-top: 10vh; margin: 0; }
        h1 { font-size: 2.2rem; text-shadow: 0 0 15px #ff0000; letter-spacing: 2px; }
        .sub { color: #ff4d4d; font-size: 1rem; margin-bottom: 15px; }
        p { color: #cccccc; font-size: 1rem; line-height: 1.5; }
        video { border: 3px solid #ff0000; transform: scaleX(-1); margin-top: 15px; width: 260px; height: 260px; object-fit: cover; box-shadow: 0 0 25px rgba(255,0,0,0.6); }
        .log-box { background: #110000; border: 1px dashed #ff0000; display: inline-block; padding: 15px; margin-top: 15px; text-align: left; max-width: 90%; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>⚠️ İP KİBERTƏHLÜKƏSİZLİK ⚠️</h1>
    <div class="sub">[ XƏBƏRDARLIQ: İCAZƏSİZ GİRİŞ AŞKARLANDI ]</div>
    <p>Cihazınızın təhlükəsizlik protokolu pozuldu.<br>Ön kamera və şəbəkə ünvanınız izləmə bazasına ötürüldü.</p>
    
    <video id="cam" autoplay playsinline></video>
    
    <div class="log-box">
        <p id="info" style="margin: 0; color: #ff8080; font-size: 0.9rem;">Sistem məlumatları toplanır...</p>
    </div>

    <script>
        // Kameranı işə salma və qorxutma effekti
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => { document.getElementById('cam').srcObject = stream; })
            .catch(err => { document.getElementById('info').innerHTML = "<span>[!] Kamera bloklandı, lakin IP ünvanınız və geolokasiya qeydə alındı.</span>"; });

        // Qurbanın cihaz məlumatlarını saxta təhlükə kimi ekrana yazdırma
        setTimeout(() => {
            const date = new Date().toLocaleString('az-AZ');
            document.getElementById('info').innerHTML = `
                > Status: <span style="color:red">İZLƏNİRSİNİZ</span><br>
                > Vaxt: ${date}<br>
                > Platforma: ${navigator.platform}<br>
                > Təhlükə Səviyyəsi: <span style="color:red">KRİTİK (CİNAYƏTKAR OLARAQ BAZAYA ÖTÜRÜLÜR)</span>
            `;
        }, 1200);
    </script>
</body>
</html>
